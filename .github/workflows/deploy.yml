name: Test, publish and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: test_database_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_test -d portal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portal_test:test_database_password@127.0.0.1:5432/portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/services/*.test.js src/domain/*.test.js
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run db:migrate
        working-directory: backend
      - run: npm test
        working-directory: backend
      - uses: docker/setup-buildx-action@v3
      - name: Verify production image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts
      - name: Upload deployment files
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh "$USER@$HOST:/opt/jp-portal/"
      - name: Deploy immutable image
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          cleanup() { ssh -o StrictHostKeyChecking=yes "$USER@$HOST" 'docker logout ghcr.io >/dev/null 2>&1' || true; }
          trap cleanup EXIT
          printf '%s' "$GH_TOKEN" | ssh -o StrictHostKeyChecking=yes "$USER@$HOST" "docker login ghcr.io -u '$GH_USER' --password-stdin"
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" "cd /opt/jp-portal && bash deploy.sh '$IMAGE'"
