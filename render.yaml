services:
  - type: web
    name: jp-portal
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@portal.com
      - key: ADMIN_NAME
        value: Muhammad Ali Ashfaq
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@portal.com
